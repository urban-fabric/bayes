[package]
name = "bayes"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
repository = "https://github.com/urban-fabric/bayes"
rust-version = "1.95"
description = "Closed-form probability and statistics for Rust: distributions, special functions, sample statistics, stochastic processes, and conjugate Bayesian updates."

[lib]
path = "src/lib.rs"

[dependencies]
rand = "0.10"
rand_chacha = "0.10"
thiserror = "2.0"
# The euclid::numeric traits: bayes writes scalar-generic closed forms over
# concrete `Real`, and lazy kernels over `LazyReal`/`LazyComplex`; scalar
# constants are lifted by Euclid, while special-function normalizers remain
# caller supplied.
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }
# Generic linear algebra over euclid's LazyMatrix (spd_inverse / gram / least_squares /
# quadratic_form), euclid-only content lifted out of ramanujan. bayes composes these in
# its matrix-tier kernels (GMRF precision, Laplace covariance, regression normal
# equations) so the multivariate densities stay write-once over any LazyMatrix backend.
frobenius = { git = "ssh://git@github.com/urban-fabric/frobenius.git", branch = "main" }

# bayes carries the euclid-only scalar closed forms + lazy kernels, plus (via frobenius)
# generic LazyMatrix algebra. The matrix-coupled *eager* multivariate stack
# (the `ramanujan` DenseMatrix / `hausdorff` S² content) lives in the sibling
# crate `ito`, which depends on bayes (the arrow is ito → bayes, never the
# reverse). Verification that bayes' write-once closed forms run on a backend
# lives in the *backend* crate, not here: see maxwell's `bayes_density` /
# `bayes_differentiable` tests (XLA) and dirac's `density_on_polars` test
# (columnar). The dependency arrow stays backend → content.

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
self_named_module_files = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true

# TEMPORARY (offline dev, multi-repo LazyScalar rollout): build against the local
# euclid sibling so the scalar-generic array contracts (real+complex) are visible.
# Reconcile to git revs before landing.
[patch."ssh://git@github.com/urban-fabric/euclid.git"]
euclid = { path = "../euclid" }
[patch."ssh://git@github.com/urban-fabric/frobenius.git"]
frobenius = { path = "../frobenius" }
