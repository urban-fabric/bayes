[package]
name = "bayes"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
repository = "https://github.com/urban-fabric/bayes"
rust-version = "1.95"
description = "Closed-form probability and statistics for Rust: distributions, special functions, sample statistics, stochastic processes, and conjugate Bayesian updates."

[lib]
path = "src/lib.rs"

[dependencies]
# Dense linear algebra (Cholesky / LU factorizations and their solves) plus the
# DenseMatrix type used by the multivariate / Gaussian-process routines.
ramanujan = { git = "ssh://git@github.com/urban-fabric/ramanujan.git", branch = "main" }
# Spherical geometry: the S² space (`S2Point`, tangent frames) that directional
# distributions (von Mises–Fisher) are defined over — the manifold as a typed space.
hausdorff = { git = "ssh://git@github.com/urban-fabric/hausdorff.git", branch = "main" }
rand = "0.10"
rand_chacha = "0.10"
thiserror = "2.0"
# The euclid::numeric traits: bayes writes scalar-generic closed forms over
# concrete `Real`, and lazy kernels over `LazyReal`/`LazyComplex`; scalar
# constants are lifted by Euclid, while special-function normalizers remain
# caller supplied.
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
self_named_module_files = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
