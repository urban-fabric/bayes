[package]
name = "bayes"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
repository = "https://github.com/urban-fabric/bayes"
rust-version = "1.95"
description = "Closed-form probability and statistics for Rust: distributions, special functions, sample statistics, stochastic processes, and conjugate Bayesian updates."

[lib]
path = "src/lib.rs"

[dependencies]
rand = "0.10"
rand_chacha = "0.10"
thiserror = "2.0"
# bayes is **numeric-only**: it writes scalar-generic closed forms over `euclid::numeric`
# (`LazyReal`/`LazyComplex`) plus host-`f64` statistics. It does not depend on the container
# tier — the matrix-coupled multivariate densities now live concretely in the backend
# (`maxwell::dist`). Verification that bayes' write-once closed forms run on a backend lives
# in the *backend* crate (see maxwell's `bayes_density` test); the arrow stays backend → content.
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
self_named_module_files = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true

# TEMPORARY (offline dev, multi-repo LazyScalar rollout): build against the local
# euclid sibling so the scalar-generic array contracts (real+complex) are visible.
# Reconcile to git revs before landing.
[patch."ssh://git@github.com/urban-fabric/euclid.git"]
euclid = { path = "../euclid" }
